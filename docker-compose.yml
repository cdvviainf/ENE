# ============================================================
# ENE — Sistema de Gestión de Operaciones · Extremo Norte Expediciones
# Puertos desplazados respecto de FAS para poder correr ambos proyectos.
# ============================================================
services:

  # ─── PostgreSQL 17 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: ene_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ene_user
      POSTGRES_PASSWORD: ene_pass
      POSTGRES_DB: ene_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - ene_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ene_user -d ene_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin 4 ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ene_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@viain.cl
      PGADMIN_DEFAULT_PASSWORD: ene_admin_pass
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5051:80"
    volumes:
      - ene_pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ─── API (ene-api) ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./ene-api
      dockerfile: Dockerfile.dev
    container_name: ene_api
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      DATABASE_URL: postgresql://ene_user:ene_pass@postgres:5432/ene_db
      NODE_ENV: development
      PORT: 3011
      TZ: America/Santiago
      BETTER_AUTH_SECRET: ene_super_secret_key_cambiar_en_produccion_32ch
      BETTER_AUTH_URL: http://localhost:3011
      MAIL_FROM: "Extremo Norte <no-reply@extremonorte.com>"
      DTE_PROVIDER: mock
      DTE_AMBIENTE: certificacion
      ADJUNTOS_PATH: /data/adjuntos
      ADJUNTOS_MAX_MB: 25
      TC_REFERENCIA_USD: 950
      CORS_ORIGIN: http://localhost:3010
    volumes:
      - ./ene-api:/app
      - ene_api_node_modules:/app/node_modules
      - ene_adjuntos:/data/adjuntos
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Web (ene-web) ──────────────────────────────────────────────────────────
  web:
    build:
      context: ./ene-web
      dockerfile: Dockerfile.dev
    container_name: ene_web
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      NEXT_PUBLIC_API_URL: http://localhost:3011/api
      NEXT_PUBLIC_APP_URL: http://localhost:3010
      # Solo servidor: dentro de la red de Docker "localhost" apunta al propio
      # contenedor web, no a ene-api. El route handler de auth usa esta
      # variable para llegar al servicio "api" por su nombre de red.
      INTERNAL_API_URL: http://api:3011
    volumes:
      - ./ene-web:/app
      - ene_web_node_modules:/app/node_modules
      - ene_web_next:/app/.next
    depends_on:
      - api

  # ─── Redis ──────────────────────────────────────────────────────────────────
  # Fuera de alcance en la fase 1: no hay trabajo asíncrono (correo, avisos
  # programados y reconfirmaciones son fase 2). Se deja declarado para no
  # rehacer el compose cuando entre BullMQ.
  #
  # redis:
  #   image: redis:7-alpine
  #   container_name: ene_redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes --requirepass ene_redis_pass
  #   ports:
  #     - "6380:6379"
  #   volumes:
  #     - ene_redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "-a", "ene_redis_pass", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  ene_postgres_data:
    driver: local
  ene_pgadmin_data:
    driver: local
  ene_api_node_modules:
    driver: local
  ene_web_node_modules:
    driver: local
  ene_web_next:
    driver: local
  ene_adjuntos:
    driver: local
  # ene_redis_data:
  #   driver: local
